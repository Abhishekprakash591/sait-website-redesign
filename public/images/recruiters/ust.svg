<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <rect width="100" height="80" rx="8" fill="#FFFFFF" />
  <g transform="translate(14, 10)">
    <!-- Letter U -->
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle">U</text>
    <!-- Square Dot next to U -->
    <rect x="42" y="16" width="10" height="10" rx="1.5" fill="#00B4D8" />
    <!-- Letters S and T -->
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle">S</text>
    <text x="48" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle">T</text>
  </g>
</svg>
